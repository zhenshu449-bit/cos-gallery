const gallery=document.getElementById("gallery"),resultCount=document.getElementById("resultCount"),
searchInput=document.getElementById("searchInput"),clearSearch=document.getElementById("clearSearch"),
emptyState=document.getElementById("emptyState"),resetSearch=document.getElementById("resetSearch"),
categoryChips=document.getElementById("categoryChips"),lightbox=document.getElementById("lightbox"),
lightboxMedia=document.getElementById("lightboxMedia"),lightboxAuthor=document.getElementById("lightboxAuthor"),
lightboxCharacter=document.getElementById("lightboxCharacter"),lightboxType=document.getElementById("lightboxType"),
lightboxPost=document.getElementById("lightboxPost"),lightboxClose=document.getElementById("lightboxClose"),
lightboxPrev=document.getElementById("lightboxPrev"),lightboxNext=document.getElementById("lightboxNext");

let activeCategory="all",filteredPosts=[...POSTS],currentIndex=0;

function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function render(){
  const q=searchInput.value.trim().toLowerCase();
  filteredPosts=POSTS.filter(p=>{
    if(activeCategory!=="all" && p.category!==activeCategory)return false;
    if(!q)return true;
    return [p.author,p.handle,p.character,p.caption,...(p.tags||[])].join(" ").toLowerCase().includes(q);
  });
  resultCount.textContent=filteredPosts.length;
  gallery.innerHTML="";
  emptyState.classList.toggle("hidden",!!filteredPosts.length);
  filteredPosts.forEach((p,i)=>{
    const card=document.createElement("article"); card.className="card";
    const badge=p.mediaType==="video"?"VIDEO":"IMAGE";
    const media=p.mediaType==="video"
      ? `<video src="${esc(p.video||"")}" poster="${esc(p.poster||"")}" muted playsinline preload="metadata"></video>`
      : `<img src="${esc(p.image||"")}" alt="${esc(p.character||p.author||"Cosplay")}" loading="lazy">`;
    card.innerHTML=`<span class="media-badge">${badge}</span>${media}<div class="card-overlay"><div class="card-author">${esc(p.author||"Unknown Creator")}</div><div class="card-character">${esc(p.character||"")}</div></div>`;
    card.onclick=()=>openLightbox(i); gallery.appendChild(card);
  });
}
function openLightbox(i){if(!filteredPosts.length)return;currentIndex=i;updateLightbox();lightbox.classList.remove("hidden");document.body.style.overflow="hidden"}
function updateLightbox(){
  const p=filteredPosts[currentIndex]; if(!p)return;
  lightboxMedia.innerHTML="";
  if(p.mediaType==="video"){
    const v=document.createElement("video");v.src=p.video||"";v.controls=true;v.autoplay=true;v.playsInline=true;v.poster=p.poster||"";lightboxMedia.appendChild(v);
  }else{
    const img=document.createElement("img");img.src=p.image||"";img.alt=p.character||"Cosplay";lightboxMedia.appendChild(img);
  }
  lightboxAuthor.textContent=`${p.author||"Unknown Creator"} ${p.handle||""}`;
  lightboxCharacter.textContent=p.character||"";
  lightboxType.textContent=p.mediaType==="video"?"VIDEO":"IMAGE";
  lightboxPost.href=p.postUrl||"#";
}
function closeLightbox(){lightbox.classList.add("hidden");lightboxMedia.innerHTML="";document.body.style.overflow=""}
function prev(){currentIndex=(currentIndex-1+filteredPosts.length)%filteredPosts.length;updateLightbox()}
function next(){currentIndex=(currentIndex+1)%filteredPosts.length;updateLightbox()}

searchInput.oninput=render;
clearSearch.onclick=()=>{searchInput.value="";render();searchInput.focus()};
resetSearch.onclick=()=>{searchInput.value="";activeCategory="all";document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));document.querySelector('[data-category="all"]').classList.add("active");render()};
categoryChips.onclick=e=>{const c=e.target.closest(".chip");if(!c)return;activeCategory=c.dataset.category;document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));c.classList.add("active");render()};
lightboxClose.onclick=closeLightbox;lightboxPrev.onclick=prev;lightboxNext.onclick=next;
lightbox.onclick=e=>{if(e.target===lightbox)closeLightbox()};
document.onkeydown=e=>{if(lightbox.classList.contains("hidden"))return;if(e.key==="Escape")closeLightbox();if(e.key==="ArrowLeft")prev();if(e.key==="ArrowRight")next()};
render();
</script>
